version: '3.7'


services:
  mysql: 
    image: mysql:latest
    container_name: mysql
    ports:
      - 3306:3306
    volumes:
#      - mysqldb:/var/lib/mysql
      - ./schema:/docker-entrypoint-initdb.d 
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio
      MYSQL_USER: mysql 
      MYSQL_PASSWORD: root


volumes:
  mysqldb:

